<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Xchange</title>
    <link href="./assets/css/output.css" rel="stylesheet">
    <link href="./assets/css/loader.css" rel="stylesheet">
</head>

<body>
    <!-- Loader Overlay -->
    <div id="loader-overlay" class="hidden fixed inset-0 z-50 bg-color-ffffff flex items-center justify-center">
        <div class="loader-container">
            <div class="loader-video">
                <video src="assets/images/gourmet-opening-loader.mp4" autoplay muted></video>
            </div>
        </div>
    </div>
    <div class="min-h-screen bg-color-ffffff">
        <header class="bg-color-ffffff shadow-soft">
            <nav class="container mx-auto px-4 py-6">
                <h1 class="character-style-3 text-color-231f20">Gourmet Xchange</h1>
            </nav>
        </header>

        <main class="container mx-auto px-4 py-12">
            <div class="bg-color-ffffff rounded-4xl shadow-soft p-8">
                <h2 class="character-style-1 text-color-231f20 mb-6">Welcome to Gourmet Xchange</h2>
                <p class="character-style-4 text-color-231f20 mb-8">Your Tailwind CSS setup with XD design variables is
                    complete!</p>

                <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="w-2 p-6 rounded-xl bg-color-3k border border-color-3k">
                        <h3 class="character-style-6 mb-2">Brand Color 3K</h3>
                        <p class="character-style-5">Light Blue - #8FBFE2</p>
                    </div>
                    <div class="p-6 rounded-xl bg-color-me border border-color-me">
                        <h3 class="character-style-6 mb-2">Brand Color ME</h3>
                        <p class="character-style-5">Purple - #C8AAD0</p>
                    </div>
                    <div class="p-6 rounded-xl bg-color-7k border border-color-7k">
                        <h3 class="character-style-6 mb-2">Brand Color 7K</h3>
                        <p class="character-style-5">Orange - #EBBB77</p>
                    </div>
                </div>

                <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="p-6 rounded-xl bg-color-retail border border-color-retail">
                        <h3 class="character-style-6 mb-2">Retail</h3>
                        <p class="character-style-5">Pink - #E29EA0</p>
                    </div>
                    <div class="p-6 rounded-xl bg-color-showroom border border-color-showroom">
                        <h3 class="character-style-8 mb-2">Showroom</h3>
                        <p class="character-style-9 text-color-231f20">Yellow - #F6EE7B</p>
                    </div>
                    <div class="p-6 rounded-xl bg-color-ancillary border border-color-ancillary">
                        <h3 class="character-style-8 mb-2">Ancillary</h3>
                        <p class="character-style-9 text-color-231f20">Light Blue - #D1E3F5</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./assets/vendor/js/jquery-3.7.1.min.js" defer></script>
    <script src="./assets/js/main.js" defer></script>

</body>

</html>
